services:
  postgres:
    image: postgres:16-alpine
    container_name: banho-e-tosa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-banho_e_tosa}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-banho_e_tosa}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
